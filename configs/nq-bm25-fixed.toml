# Keyword retrieval over fixed-size chunks: the baseline every other setup is measured against.

name = "nq-bm25-fixed"
description = "BM25 with stemming over fixed-size word chunks of the Natural Questions pages."
seed = 1

[corpus]
name = "natural-questions"
split = "validation"

[chunking]
strategy = "fixed_words"
size = 150
overlap = 30

[retrieval]
method = "bm25"
depth = 100
# Anserini's defaults, which the BEIR paper used for its BM25 baseline.
k1 = 0.9
b = 0.4
stem = true

[evaluation]
cutoffs = [1, 5, 10, 100]
