# Regression gate: MiniLM embeddings over the committed golden slice, run on CPU in CI.

name = "gate-minilm"
description = "all-MiniLM-L6-v2 embeddings over fixed-size chunks of the golden slice, for the regression gate."
seed = 1

[corpus]
name = "natural-questions"
split = "validation"

[chunking]
strategy = "fixed_words"
size = 150
overlap = 30

[retrieval]
method = "dense"
depth = 100

[retrieval.dense]
model = "all-MiniLM-L6-v2"

[evaluation]
cutoffs = [1, 5, 10, 100]
