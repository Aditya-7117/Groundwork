# Regression gate: BM25 over the committed golden slice, run in CI on every push.

name = "gate-bm25"
description = "BM25 with stemming over fixed-size chunks of the golden slice, for the regression gate."
seed = 1

[corpus]
name = "natural-questions"
split = "validation"

[chunking]
strategy = "fixed_words"
size = 150
overlap = 30

[retrieval]
method = "bm25"
depth = 100

[retrieval.bm25]
k1 = 0.9
b = 0.4
stem = true

[evaluation]
cutoffs = [1, 5, 10, 100]
