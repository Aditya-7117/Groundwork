# PROVISIONAL. This experiment exists to exercise the pipeline end to end. BEIR SciFact is
# placeholder plumbing, not the project's chosen corpus, and numbers from this config are not
# results of the project.

name = "provisional-scifact-bm25"
description = "Plumbing check: BM25 over fixed-size word chunks of BEIR SciFact, test split."
seed = 1

[corpus]
name = "beir-scifact"
split = "test"

[chunking]
strategy = "fixed_words"
size = 200
overlap = 50

[retrieval]
method = "bm25"
depth = 100
# Anserini's defaults, which the BEIR paper used for its BM25 baseline.
k1 = 0.9
b = 0.4

[evaluation]
cutoffs = [1, 5, 10, 100]
