name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Cache model weights and sentence data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/huggingface
            data/nltk_data
          key: models-minilm-1110a243-punkt-tab

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy

      - name: Tests
        run: uv run --no-sync pytest

      - name: Regression gate
        run: uv run --no-sync groundwork gate tests/golden/baseline.json --device cpu

  explorer:
    name: Explorer types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/explorer/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
