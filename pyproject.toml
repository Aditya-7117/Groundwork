[project]
name = "groundwork"
version = "0.1.0"
description = "An evaluation harness that measures which retrieval-augmented generation configuration actually works."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Aniruddha Magar" }]
dependencies = [
    "fastapi>=0.141.1",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
groundwork = "groundwork.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytrec-eval-terrier>=0.5.10",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",     # builtin shadowing
    "ANN",   # annotations
    "B",     # bugbear
    "BLE",   # blind except
    "C4",    # comprehensions
    "D",     # docstrings
    "DTZ",   # naive datetimes
    "E",     # pycodestyle errors
    "ERA",   # commented-out code
    "F",     # pyflakes
    "FBT",   # boolean positional arguments
    "G",     # logging format
    "I",     # import order
    "LOG",   # logging misuse
    "N",     # naming
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib over os.path
    "RET",   # return consistency
    "RUF",   # ruff-specific
    "S",     # bandit security checks
    "SIM",   # simplifications
    "T20",   # print statements
    "TRY",   # exception handling
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D105",   # magic methods are self-describing
    "D107",   # __init__ is documented on the class
    "TRY003", # long messages at the raise site are clearer than one exception class per message
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # test names are the documentation
    "PLR0913", # fixture builders take one argument per field of the record they build
    "PLR2004", # hand-worked expected values are the point of the tests
    "S101",    # pytest uses assert
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# pyarrow ships no type information, so its imports cannot be checked. Everything read through it
# is converted to typed records in natural_questions.py before it reaches the rest of the code.
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy's sparse module ships no type information; only csc_matrix construction is used.
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nltk ships no py.typed marker either, so its imports cannot be checked.
module = ["nltk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error"]

# Linux installs (CI and the container) take PyTorch's CPU-only build: neither has a GPU, and the
# standard Linux build bundles several gigabytes of NVIDIA libraries. macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
